<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivi-Paperi-Sakset - Odota</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .info {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #2e7d32;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            color: white;
        }
        .score {
            text-align: center;
        }
        .score-value {
            font-size: 2em;
            font-weight: bold;
        }
        .score-label {
            font-size: 0.85em;
            opacity: 0.9;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .moves {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .move-btn {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 15px;
            font-size: 2.5em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #f5f5f5;
        }
        .move-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Kaksinpeli</h1>
        
        <div class="info">
            ✅ Pelaaja 1 on valinnut siirtonsa!
        </div>
        
        <div class="scoreboard">
            <div class="score">
                <div class="score-value">{{ ekan_pisteet }}</div>
                <div class="score-label">Pelaaja 1</div>
            </div>
            <div class="score">
                <div class="score-value">{{ tasapelit }}</div>
                <div class="score-label">Tasapelit</div>
            </div>
            <div class="score">
                <div class="score-value">{{ tokan_pisteet }}</div>
                <div class="score-label">Pelaaja 2</div>
            </div>
        </div>
        
        <h2>Pelaaja 2, valitse siirtosi:</h2>
        <form action="/siirto/{{ pelityyppi }}" method="post">
            <div class="moves">
                <button type="submit" name="siirto" value="k" class="move-btn" title="Kivi">🪨</button>
                <button type="submit" name="siirto" value="p" class="move-btn" title="Paperi">📄</button>
                <button type="submit" name="siirto" value="s" class="move-btn" title="Sakset">✂️</button>
            </div>
        </form>
    </div>
</body>
</html>
